name: Deploy Preview

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
  workflow_dispatch:

jobs:
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
      FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
      EMDASH_URL: ${{ vars.EMDASH_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Font Awesome Pro
        run: bash scripts/setup-npmrc.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Generate worker name from branch
        id: worker-name
        run: |
          # Convert branch name to valid worker name (lowercase, replace / with -)
          BRANCH="${{ github.ref_name }}"
          WORKER_NAME=$(echo "$BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "name=${WORKER_NAME}" >> $GITHUB_OUTPUT
          echo "Worker name: ${WORKER_NAME}"

      - name: Deploy preview worker
        run: |
          pnpm exec wrangler deploy \
            --config wrangler.jsonc \
            --name ${{ steps.worker-name.outputs.name }} \
            --compatibility-date 2025-11-17

      - name: Comment preview URL
        uses: actions/github-script@v9
        with:
          script: |
            const workerName = '${{ steps.worker-name.outputs.name }}';
            const previewUrl = `https://${workerName}.unltd.workers.dev`;

            // Find associated PR
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open'
            });

            if (prs.length > 0) {
              const pr = prs[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🚀 **Preview deployed!**\n\n🔗 ${previewUrl}\n\nThis preview will be updated on each push to this branch.`
              });
            }

            console.log(`Preview URL: ${previewUrl}`);
