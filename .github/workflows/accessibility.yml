name: Accessibility scan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly, so content-only changes (e.g. via the CMS) get checked too
    - cron: "0 6 * * 1"

jobs:
  scan:
    name: Scan built site with pa11y-ci
    runs-on: ubuntu-latest
    env:
      EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
      FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      SHOW_DRAFTS: "false"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Font Awesome Pro
        run: bash scripts/setup-npmrc.sh

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build site
        run: npx astro build

      - name: Lint accessibility (eslint-plugin-astro + jsx-a11y)
        run: npm run lint:a11y

      - name: Scan built site with pa11y-ci
        run: npm run test:a11y
