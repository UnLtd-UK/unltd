name: Cleanup Preview Workers

on:
  delete:
  pull_request:
    types: [closed]

jobs:
  cleanup-worker:
    name: Delete preview worker
    runs-on: ubuntu-26.04
    # Only run on branch deletion or merged PRs
    if: |
      github.event_name == 'delete' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Get branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "delete" ]; then
            BRANCH="${{ github.event.ref }}"
          else
            BRANCH="${{ github.event.pull_request.head.ref }}"
          fi
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Generate worker name from branch
        id: worker-name
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          WORKER_NAME=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-63 | sed 's/-*$//')
          echo "name=${WORKER_NAME}" >> $GITHUB_OUTPUT
          echo "Worker to delete: ${WORKER_NAME}"

      - name: Delete preview custom domain
        run: |
          HOSTNAME="${{ steps.worker-name.outputs.name }}.unltd.org.uk"
          API="https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/domains"
          AUTH="Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"

          DOMAIN_IDS=$(curl -s -H "$AUTH" "$API?hostname=$HOSTNAME" | jq -r '.result[]?.id')

          if [ -z "$DOMAIN_IDS" ]; then
            echo "ℹ️ No custom domain found for: $HOSTNAME"
          else
            for ID in $DOMAIN_IDS; do
              curl -s -X DELETE -H "$AUTH" "$API/$ID" | jq -c '{success, errors}'
              echo "Detached custom domain: $HOSTNAME ($ID)"
            done
          fi

      - name: Delete Cloudflare Worker
        run: |
          WORKER_NAME="${{ steps.worker-name.outputs.name }}"
          echo "Attempting to delete worker: $WORKER_NAME"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/$WORKER_NAME" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Successfully deleted worker: $WORKER_NAME"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "ℹ️ Worker not found (may have already been deleted): $WORKER_NAME"
          else
            echo "⚠️ Unexpected response when deleting worker: $WORKER_NAME"
          fi
