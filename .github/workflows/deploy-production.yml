name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Daily at 01:00 UTC - rebuilds production to keep round status current
    - cron: "0 1 * * *"

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
      FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
      EMDASH_URL: ${{ vars.EMDASH_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Font Awesome Pro
        run: bash scripts/setup-npmrc.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Deploy worker
        run: pnpm exec wrangler deploy --config wrangler.jsonc --env production
