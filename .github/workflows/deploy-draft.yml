name: Deploy Draft Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Every 2 hours - rebuilds draft environment to pick up CMS changes
    - cron: "0 */2 * * *"

jobs:
  deploy-draft:
    name: Deploy draft preview
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
      FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      SHOW_DRAFTS: "true"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Font Awesome Pro
        run: bash scripts/setup-npmrc.sh

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy worker
        run: npx wrangler deploy --name draft --compatibility-date 2025-11-17
