overrides:
  vite: ^8
  sharp: ^0.35.4

allowBuilds:
  better-sqlite3: true
  core-js: false
  esbuild: true
  fsevents: true
  sharp: true
  puppeteer: true
  workerd: true

# @typescript-eslint/* peer-depends on typescript <6.1 but this project runs
# typescript@7; the mismatch is intentional (see scripts/link-eslint-typescript.cjs).
strictPeerDependencies: false

