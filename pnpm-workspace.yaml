  - '@astrojs/internal-helpers@0.13.1'
  - '@astrojs/markdown-satteri@0.4.7'
  - '@astrojs/mdx@8.1.3'
  - '@astrojs/node@11.1.11'
  - '@astrojs/react@7.1.4'
  - '@posthog/browser-common@0.10.7'
  - '@posthog/core@1.64.0'
  - '@posthog/types@1.421.0'
  - astro@7.4.7
  - jsdom@31.0.0
  - lucide-react@1.69.0
  - miniflare@5.20261104.0-beta
  - posthog-js@1.447.0 || 1.447.1
  - wrangler@4.158.0
  - '@pnpm/exe.android-arm64@12.18.0'
  - '@pnpm/exe.android-x64@12.18.0'
  - '@pnpm/exe.darwin-arm64@12.18.0'
  - '@pnpm/exe.darwin-x64@12.18.0'
